<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <title>Return to Stuard</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f2eb; color: #1f3330;
           font: 17px/1.5 -apple-system, BlinkMacSystemFont, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
    @media (prefers-color-scheme: dark) { body { background: #121414; color: #ebebe3; } }
    h1 { font-family: "New York", Georgia, serif; font-weight: 500; }
  </style>
</head>
<body>
  <main>
    <h1>Return to Stuard</h1>
    <p>Oura sign-in finishes inside the Stuard app. If you landed here, close this page and connect Oura from Stuard on your iPhone.</p>
  </main>
  <script>
    // Oura returns here with the result after "#" (an access token, or an error), which browsers never
    // send to any server. Hand it straight back to Stuard's sign-in sheet, which is waiting for
    // stuard-oura://callback, then wipe it from this page's address and history.
    (function () {
      var result = location.hash.length > 1 ? location.hash : (location.search.length > 1 ? "#" + location.search.slice(1) : "");
      history.replaceState(null, "", location.pathname);
      if (result && /(access_token|error)=/.test(result)) {
        location.replace("stuard-oura://callback" + result);
      }
    })();
  </script>
</body>
</html>
